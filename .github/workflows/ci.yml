name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricelens
          POSTGRES_PASSWORD: pricelens
          POSTGRES_DB: pricelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pricelens -d pricelens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pricelens:pricelens@localhost:5432/pricelens
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: test-password-123
      LAN_ONLY: "false"
      INLINE_SEARCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci
