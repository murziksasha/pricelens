server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location /health {
    proxy_pass http://api:3000/health;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
